<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Interactive Image Gallery</h1>
        <p>Click on any image to view it in a larger size.</p>
    </header>

    <main class="gallery">

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800" alt="Nature">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800" alt="Mountain">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Landscape">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Forest">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="Beach">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=800" alt="Nature">
        </div>

    </main>

    <div id="lightbox" class="lightbox">
        <span id="close">&times;</span>
        <img id="lightbox-img" src="" alt="Large Image">
    </div>

    <script src="script.js"></script>

</body>
</html>
